[tool.ruff]
# Define a versão do Python que você está usando (mude para a sua se for diferente)
target-version = "py311"
# Define o tamanho máximo de linha padrão do mercado
line-length = 88

[tool.ruff.lint]
# Ativa regras básicas de erro (E, F) e do ecossistema (I para organizar imports)
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"  # Ajuste para a sua versão do Python se necessário
strict = true            # Modo estrito: exige que praticamente tudo seja tipado
ignore_missing_imports = true # Evita que ele reclame de bibliotecas sem tipagem própria
disallow_untyped_decorators = false

explicit_package_bases = true
namespace_packages = true

[tool.uv.workspace]
members = [
    "even",
    "odd",
    "save",
    "check",
    "api",
]

[project]
name = "meu-projeto"
version = "0.1.0"
dependencies = [
    "fastapi>=0.136.3",
    "mypy>=2.1.0",
    "nats-py>=2.14.0",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "ruff>=0.15.15",
    "uvicorn>=0.48.0",
]
requires-python = ">=3.11"
